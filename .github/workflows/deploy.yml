name: Deploy FloorFlow (manual)
run-name: Deploy main at ${{ github.sha }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: floorflow-demo-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'Perss00n/FloorFlow'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful existing CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [[ "$conclusion" != "success" ]]; then
            echo 'CI for this exact main commit must finish successfully before dispatching deployment.' >&2
            exit 1
          fi

      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test and stage the package allowlist
        run: |
          python3 -B -m unittest discover -s test -p test_github_package.py -v
          python3 -B scripts/build-github-package.py stage "$RUNNER_TEMP/floorflow-app"

      - name: Install locked Linux production dependencies
        working-directory: ${{ runner.temp }}/floorflow-app
        run: npm ci --omit=dev --ignore-scripts --bin-links=false --no-audit --no-fund --engine-strict

      - name: Build and inspect the actual deployment ZIP
        run: |
          python3 -B scripts/build-github-package.py pack "$RUNNER_TEMP/floorflow-app" "$RUNNER_TEMP/floorflow.zip"
          cat "$RUNNER_TEMP/floorflow.zip.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the packaged runtime with AI disabled
        run: |
          python3 -B -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$RUNNER_TEMP/floorflow.zip" "$RUNNER_TEMP/floorflow-check"
          cd "$RUNNER_TEMP/floorflow-check"
          node --input-type=module <<'NODE'
          import { createApp } from './src/app.js';
          import { configureAssistant } from './src/assistant/config.js';
          if (configureAssistant({}).assistant !== null) process.exit(1);
          createApp({ query: async () => ({ rows: [] }) });
          console.log(process.version, process.platform, process.arch, 'runtime imports OK; AI disabled');
          NODE

      - name: Pass only the checked ZIP and checksum to deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floorflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/floorflow.zip
            ${{ runner.temp }}/floorflow.zip.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'Perss00n/FloorFlow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Download this run's checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: floorflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/floorflow-artifact
          digest-mismatch: error

      - name: Verify transferred ZIP bytes
        working-directory: ${{ runner.temp }}/floorflow-artifact
        run: sha256sum --check floorflow.zip.sha256

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Deploy to the existing App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: app-floorflow-demo-6e9587
          resource-group-name: rg-floorflow-demo
          package: ${{ runner.temp }}/floorflow-artifact/floorflow.zip
          type: zip
          clean: 'true'
          restart: 'true'
